name: build lowcode1117 final V5 guide

on:
  push:
    paths:
      - '.github/workflows/lowcode1117-build-v5.yml'
      - '低代码1117/四大部位逐项填写_11181455_V5_生成脚本.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          python -m pip install --quiet python-docx Pillow PyMuPDF
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-core fonts-noto-cjk >/dev/null
      - name: Generate DOCX with original images
        run: python '低代码1117/四大部位逐项填写_11181455_V5_生成脚本.py'
      - name: Render and verify concise guide
        shell: bash
        run: |
          mkdir -p /tmp/lowcode1117v5
          libreoffice -env:UserInstallation=file:///tmp/lo-lowcode1117-v5 --headless --convert-to pdf --outdir /tmp/lowcode1117v5 '低代码1117/烤房四大部位信息采集操作指南_逐项填写原图版_11181455_V5.docx'
          python - <<'PY'
          import fitz, pathlib, json, re, zipfile
          root=pathlib.Path('低代码1117')
          pdf=pathlib.Path('/tmp/lowcode1117v5/烤房四大部位信息采集操作指南_逐项填写原图版_11181455_V5.pdf')
          doc=root/'烤房四大部位信息采集操作指南_逐项填写原图版_11181455_V5.docx'
          assert pdf.exists() and doc.exists()
          f=fitz.open(pdf)
          text='\n'.join(p.get_text() for p in f)
          terms=['主体门窗','加热设备','循环自控','附属设施','挂烟梁','钢制挂烟梁','木制挂烟梁','装烟棚','烟夹','编烟机','差','较差','照片']
          for s in terms:assert s in text,s
          assert len(f)>=10
          for term in ('逐项填写·原图完善版','11.13','9.29','11.17','原始完整截图','栏目总览','展开后：','共用填写方法','页面一','页面二'):
            assert term not in text, ('draft phrasing',term)
          from docx import Document
          d=Document(doc)
          required=[r for p in d.paragraphs for r in p.runs if '*' in r.text and r.font.color.rgb and str(r.font.color.rgb)=='C00000']
          assert len(required)>=20, ('required fields red',len(required))
          blanks=[i+1 for i,p in enumerate(f) if len(p.get_text().strip())==0]
          assert not blanks,('blank pages',blanks)
          # Page previews for manual visual review
          key=list(range(len(f)))
          for idx in sorted(set(key)):
            pix=f[idx].get_pixmap(matrix=fitz.Matrix(1.2,1.2),alpha=False)
            pix.save(str(root/f'_V5版式抽查_页{idx+1:02d}_11181455.png'))
          result=dict(pages=len(f),word_bytes=doc.stat().st_size,
            preview_pages=[i+1 for i in sorted(set(key))],missing_terms=[],
            visual_blanks=blanks,
            required_fields_red=len(required),
            note='原图未剪裁；剔除指定的烤房加盖图片；所有其他图片保留；必填字段标红；已核对正式文稿措辞')
          (root/'_V5原图简版核验_11181455.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('QA_OK',result)
          PY
      - name: Commit Word and QA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '低代码1117/烤房四大部位信息采集操作指南_逐项填写原图版_11181455_V5.docx' '低代码1117/_V5原图简版核验_11181455.json' '低代码1117/_V5版式抽查_'*
          if ! git diff --cached --quiet; then
            git commit -m 'docs: concise original image illustrated operating guide V5 11181455'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
