name: lowcode1117 build illustrated guide

on:
  push:
    paths:
      - '.github/workflows/lowcode1117-build-doc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install document tools
        run: python -m pip install --quiet python-docx pillow
      - name: Build complete illustrated Word operation guide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,zipfile,datetime,os
          from docx import Document
          from docx.shared import Cm,Pt,RGBColor
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.table import WD_TABLE_ALIGNMENT,WD_CELL_VERTICAL_ALIGNMENT
          from docx.enum.style import WD_STYLE_TYPE
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from PIL import Image

          root=Path("低代码1117")
          shots=root/"解压截图_11172053"
          manifest=json.loads((shots/"_截图明细_11172053.json").read_text(encoding="utf-8"))
          imgs={int(p.name[:3]):p for p in shots.glob("*.jpg") if re.match(r"\d{3}_Screenshot_",p.name)}
          assert len(imgs)==41, ("Screenshot count changed", len(imgs))
          doc=Document()
          sec=doc.sections[0]
          sec.page_width=Cm(21);sec.page_height=Cm(29.7)
          sec.top_margin=Cm(2.54);sec.bottom_margin=Cm(2.54)
          sec.left_margin=Cm(3.17);sec.right_margin=Cm(3.17)
          sec.header_distance=Cm(1.2);sec.footer_distance=Cm(1.3)
          normal=doc.styles["Normal"]
          normal.font.name="仿宋_GB2312";normal.font.size=Pt(14)
          normal._element.rPr.rFonts.set(qn("w:eastAsia"),"仿宋_GB2312")
          normal.paragraph_format.line_spacing=1.45
          normal.paragraph_format.space_after=Pt(5)
          def apply_font(r,name="仿宋_GB2312",size=14,bold=False,color=None):
            r.font.name=name;r.font.size=Pt(size);r.font.bold=bold
            r._element.get_or_add_rPr().rFonts.set(qn("w:eastAsia"),name)
            if color:r.font.color.rgb=RGBColor(*color)
            return r
          def p(txt="",bold=False,size=14,indent=True,align=None):
            pp=doc.add_paragraph()
            if indent:pp.paragraph_format.first_line_indent=Pt(28)
            pp.paragraph_format.keep_together=True
            if align is not None:pp.alignment=align
            apply_font(pp.add_run(txt),size=size,bold=bold)
            return pp
          def head(txt,level=1):
            pp=doc.add_paragraph()
            pp.paragraph_format.space_before=Pt(12 if level==1 else 8)
            pp.paragraph_format.space_after=Pt(7)
            pp.paragraph_format.keep_with_next=True
            pp.paragraph_format.keep_together=True
            apply_font(pp.add_run(txt),size=16 if level==1 else 14,bold=True)
            return pp
          def note(label,txt):
            pp=doc.add_paragraph()
            pp.paragraph_format.first_line_indent=Pt(0)
            pp.paragraph_format.space_after=Pt(5)
            apply_font(pp.add_run(label+"："),bold=True)
            apply_font(pp.add_run(txt))
            return pp
          def bullets(lines):
            for text in lines:
              pp=doc.add_paragraph()
              pp.paragraph_format.left_indent=Pt(14)
              pp.paragraph_format.first_line_indent=Pt(-14)
              pp.paragraph_format.space_after=Pt(3)
              apply_font(pp.add_run("（1）"+text))
          def add_img(path,title=None,height_limit=17.0):
            with Image.open(path) as im:
              w,h=im.size
            width=min(11.2, height_limit*w/h)
            para=doc.add_paragraph()
            para.alignment=WD_ALIGN_PARAGRAPH.CENTER
            para.paragraph_format.keep_with_next=True
            para.paragraph_format.space_after=Pt(1)
            para.add_run().add_picture(str(path),width=Cm(width))
            if title:
              cap=doc.add_paragraph()
              cap.alignment=WD_ALIGN_PARAGRAPH.CENTER
              cap.paragraph_format.space_after=Pt(9)
              apply_font(cap.add_run(title),size=11)
          fig=0; used=[]
          def shot(i,title,steps,check=None):
            global fig
            assert i in imgs,(i,title)
            fig+=1; used.append(i)
            head(title,2)
            for n,t in enumerate(steps,1):
              note("操作"+str(n),t)
            if check:note("核查要点",check)
            name=imgs[i].name
            ts=re.search(r"20\d{4}",name)
            pic_label="图"+str(fig)+"　"+title+"（截图序号"+str(i).zfill(3)+"）"
            add_img(imgs[i],pic_label,16.4)
          def chapter(num,title,overview_idx,overview_desc,fieldrows):
            doc.add_page_break()
            head(f"{num}、{title}",1)
            p(overview_desc)
            shot(overview_idx,f"{title}：未展开表单总览",[
              "从“搜索数据”底部点击对应入口，先核对“关联项目编号”，再检查页面列出的折叠分组；不要急于填写，更不要将截图中的演示编号照抄为当前烤房编号。",
              "点击每个灰色分组栏右侧的箭头，展开后逐一处理带红色“*”的必填项；可保存阶段性录入，全部完成并核查后再点击“提交”。"
            ],"页面自上而下依次作业；遇到图片上传、年份选择、评价栏时，按照相应分节操作。")
            head("（一）本入口字段与填报口径",2)
            tab=doc.add_table(rows=1, cols=3)
            tab.style="Table Grid";tab.alignment=WD_TABLE_ALIGNMENT.CENTER
            for c,v in zip(tab.rows[0].cells,["页面分组/字段","现场怎么核实","怎样填写、拍照或判定"]):
              apply_font(c.paragraphs[0].add_run(v),size=11,bold=True)
            for row in fieldrows:
              cells=tab.add_row().cells
              for cell,v in zip(cells,row):
                cell.vertical_alignment=WD_CELL_VERTICAL_ALIGNMENT.CENTER
                pp=cell.paragraphs[0];pp.paragraph_format.space_after=Pt(1)
                apply_font(pp.add_run(v),size=11)
            p("本表是对当前截图页面的操作解释。具体以实时表单显示的字段和选项为准；未在截图中出现的项目，不擅自视为必填项。",size=12)
          def sectiontail(title,checks):
            head("（三）"+title+"提交前核查",2)
            for i,t in enumerate(checks,1):p(f"{i}. {t}",indent=False)
          title=doc.add_paragraph()
          title.alignment=WD_ALIGN_PARAGRAPH.CENTER
          title.paragraph_format.space_after=Pt(15)
          apply_font(title.add_run("烤房四大部位信息采集详细操作指南"),"方正小标宋简体",22,True)
          sub=doc.add_paragraph()
          sub.alignment=WD_ALIGN_PARAGRAPH.CENTER
          apply_font(sub.add_run("——主体门窗、加热设备、循环自控、附属设施"),size=14)
          sub.paragraph_format.space_after=Pt(14)
          p("配套文件：《烤房项目基础信息录入指南（11.13）》；依据：《烤房信息采集说明（9.29）》和2026年11月17日现场操作截图。文件编号：11172053。",size=12,indent=False)
          p("适用对象：烤房信息现场采集技术员、烟站复核人员和县级烟叶办数据管理人员。本指南从已找到烤房且基础信息已经核对的环节接续，重点讲清四个设备入口“打开哪个分组、选哪个字段、照片怎么拍、如何保存和提交”，与前版基础信息录入指南分工清楚。")
          head("一、总览页面：先认清四个入口",1)
          add_img(root/"6e408f052c2c854c097659b8a008a62a.jpg","图1　搜索数据页面及底部四个设备采集入口（总览截图）",17.5);fig=1
          note("入口顺序","建议按“主体门窗→加热设备→循环自控→附属设施”逐项采集；每完成一个入口，核对保存和提交提示，再点击右上角关闭本次表单，进入下一个入口。")
          note("页面结构","顶部显示所选烤房的项目编号及相关信息；底部是四个彩色图标。点击图标后会弹出设备采集表单，页底固定显示“保存”和“提交”。")
          note("与旧指南的衔接","手机打开低代码、进入“现场数据采集—烤房项目基础信息采集”、搜索烤房编号、通过“其他—信息完善”核对基础档案，具体路径和操作已由11.13版指南说明，本指南不重复展开。")
          head("二、正式采集前的三个核对",1)
          p("一核编号：截图涉及23-420527KF00144、23-420527KF00147、23-420527KF00138等多个演示编号，属于不同烤房。每打开一个设备入口，都要核对“关联项目编号”与现场烤房编号一致，发现不一致立即退出重选，防止覆盖其他记录。")
          p("二核设备：一座烤房按现场实际情况判定“正常、损坏、缺失”。状态要以设备能否安全正常工作、是否有实物及损坏情况为依据，不能只看设备外观、不能凭历史台账直接认定。")
          p("三核影像：11月17日最新表单顶部显示，正常设备拍摄全景图1张；损坏设备拍摄全景图、瑕疵细节图各1张；缺失设备拍摄全景图1张。9.29版文字曾写“缺失无须照片”，与现行页面提示不同，执行时以当前系统要求及业务部门最新通知为准。散热器、循环风机、温湿度传感器、冷风进风设备等在9.29说明中列为只评价、不拍部件照的项目，应按实际字段是否出现上传框执行，不要自行补造照片。")
          head("三、图片上传的通用做法",1)
          p("先选设备状态，再选择最新修复、改造年度，最后拍照。正常设备拍摄完整外观，尽量把部件、安装位置、关键结构一起纳入画面；损坏设备除全景外，另拍裂缝、破损、漏风、变形等问题部位的清晰近照；缺失设备应拍摄设备原安装位置的全景，能够证明该部件确实缺失。避免逆光、模糊、反光、手指遮挡和拍到其他烤房。")
          p("点击“拍照上传”后，截图可见系统弹出“系统相机”和“浏览器相机”选择。建议现场优先使用可正常调用且定位准确的相机通道，确认照片预览后再返回表单；若权限被拒绝，应先检查微信或浏览器的相机权限。上传后检查是否出现照片缩略图，未上传成功不可只凭已点击按钮就认定完成。")
          p("网络较弱时，先保存已填字段并记录对应编号，不要在加载中反复点击“提交”。11.13指南规定有“异地上传”入口：现场拍好设备照片、记录编号和状态，待网络恢复后按权限进入异地采集，提交后由烟叶办审核。切勿将其他烤房照片充当本房影像。")

          chapter("四","主体门窗",40,
            "本入口围绕烤房主体结构、门窗与装烟空间采集，按“加热室外立面—大门—装烟室—挂烟梁—综合评价—更新GPS信息”的页面顺序填写。检查裂缝、漏雨、门窗密封、挂烟梁安全性，避免只填“正常”而无现场依据。",
            [
              ("加热室外立面","面对加热室外侧，查看墙体、清灰门与风机检修门","选择实际状态和最新修复/改造年度，按现行页面上传全景照片；有裂损另拍瑕疵近照。"),
              ("大门（含观察窗）","开合门体、看观察窗和密封条是否完好","选大门状态、维修年度；正常拍门体全景，损坏应拍门扇、铰链或观察窗缺陷。"),
              ("装烟室（地面、屋墙等）","检查地面、墙体和顶部是否出现破损漏雨","选装烟室门状态及最新修复年度；照片清晰覆盖装烟室代表性情况。"),
              ("挂烟梁／材质","现场判断挂烟梁实物及材质，必要时观察固定点","选择页面“材质*”的对应选项，不凭建设年代推断；发现缺失或变形及时记录。"),
              ("综合评价","汇总主体完整性、门窗密封性、屋墙情况和维修年限","按当前三级选择“优良、较好、较差”，不是照搬9.29旧稿的四级表述。"),
              ("更新GPS信息","核对现场实际位置与系统经纬度，避免跨房定位","当前界面提示在500米内可手工调整、仅可调整两次；谨慎定位后点击获取经纬度并核验数值。")
            ])
          head("（二）按页面展开顺序逐图操作",2)
          shot(19,"主体门窗：另一烤房的未展开页面示例",[
            "这一截图关联编号为23-420527KF00147，仅用于说明页面的分组顺序；与00144的截图不是同一座烤房。",
            "应先选定当前真实烤房，再沿页面由上到下打开“加热室外立面、大门、装烟室、挂烟梁、综合评价、更新GPS信息”。"],"切勿跨项目编号复用状态或照片。")
          shot(39,"年份选择的滚轮示例",[
            "点击“最新修复、改造年度”右侧箭头，系统显示年份滚轮（截图显示2025、2026、2027等）。",
            "上下滑动到实际完成修复或改造的年份，点击“确定”；不要把截图中的2026直接当作每座烤房的统一年度。"],"年限来源以实际验收、维修记录及现场核对为准；无依据时不得编造。")
          shot(38,"照片上传：选择系统相机或浏览器相机",[
            "触碰“拍照上传”，弹出的选择框包含“系统相机”和“浏览器相机”；选可正常工作的拍摄方式，按照手机授权提示拍摄。",
            "在拍摄界面核对是否为正确部件，完成后检查表单中照片预览是否成功显示。"],"不要把“选择了拍照方式”等同于“照片已上传”。")
          shot(37,"照片上传：实际相机界面",[
            "进入相机后将目标部件放在画面中央，拍摄范围应能辨认设备本体及其在烤房中的安装位置。",
            "出现闪退、黑屏或权限限制时，返回上一页改用另一相机入口；不要离开当前表单后忘记回到相同项目编号。"])
          shot(36,"大门、装烟室展开后的字段填写",[
            "在“大门”中依次选择“大门-状态*”“大门-最新修复、改造年度*”，按提示上传“大门-正常设备全景照片*”。",
            "继续展开“装烟室”，根据地面、屋墙情况填写“装烟室门-状态*”和“装烟室-最新修复、改造年度*”。"],"截图中绿色“正常”是演示选择，不是通用默认值。")
          shot(35,"装烟室、挂烟梁：状态与材质",[
            "完成装烟室后向下展开“挂烟梁”，核对是否存在钢质或木质挂烟结构，使用“材质*”的下拉选项作出选择。",
            "装烟室存在门体损伤、墙面裂痕、地面明显损坏等问题时，不应简单选择正常；现场照片要覆盖问题。"])
          shot(34,"挂烟梁之后的页面衔接",[
            "从挂烟梁分组下拉到“综合评价”，不要漏掉下方评价与定位相关字段。",
            "如果屏幕只显示部分信息，应持续向上滑动表单内容区域；不要把页面底部固定“保存／提交”误认为全部内容已填写完毕。"])
          shot(33,"综合评价：先阅读三级判定标准",[
            "当前页面按“优良、较好、较差”三级描述设备表现、维修年代和预计使用期限；先对照现场实况，再点击“评价选择*”。",
            "同一烤房的整体评价应综合主体、设备、修复记录；不要简单用建设年度替代实物检查。"])
          shot(32,"综合评价：打开下拉候选项",[
            "在“评价选择*”点击选择框，看到“优良、较好、较差”选项后选择与现场相符的一项。",
            "若属于需重点维修的老旧结构，即使个别部件仍可使用，也应结合全部实况慎重评价。"])
          shot(31,"综合评价：另一次选项展示",[
            "截图用于说明评价下拉可能在页面不同位置弹出，但选项名称与业务判定口径一致。",
            "选择后应关闭下拉并查看已选标签是否确实写回字段。"])
          shot(30,"GPS更新：定位未获取时的页面",[
            "“更新GPS信息”展开后可见“定位*”“获取当前位置”，下方经度、纬度可能显示“暂无内容”。",
            "在现场开启手机定位权限后点击获取当前位置；未获取坐标前不要以空值强行提交。"])
          shot(29,"GPS更新：定位结果与手工调整提示",[
            "截图显示“允许手工调整定位位置（500米内），仅可调整两次”，定位地址须与烤房实际位置一致。",
            "移动地图标记前先检查行政区划、道路和村庄，避免手机定位点落在宿舍、办公室或邻近烤房。"])
          shot(28,"GPS更新：地图选点与经纬度回填",[
            "地图提示可移动并点击标注精确位置，随后按页面按钮获取经纬度信息，核查经度、纬度是否回填。",
            "经纬度属于示例数值，不得直接复制；若与原始行业基础台账差异明显，按管理权限和业务要求复核后再处理。"])
          sectiontail("主体门窗",[
            "各分组带“*”的字段已填写，挂烟梁材质与现场实物相符；有损坏时既有状态记录又有清楚的瑕疵影像。",
            "综合评价已按当前三级口径填写；定位未超出允许调整范围，若已修改，能说明修改依据。",
            "核对当前项目编号、照片和年度后点击“提交”，确认成功提示，再关闭表单返回。"])

          chapter("五","加热设备",26,
            "本入口包括“基础信息、燃烧机、散热器”三个分组，重点是核实热源类型、燃烧机状态、散热器状态和最新修复、改造年度。特别注意“燃烧机”和“散热器”不是同一个部件；先确认设备类型再填写其余分组。",
            [
